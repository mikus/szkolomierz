[project]
name = "compare-primary-schools-mazowieckie"
version = "0.1.0"
description = "Analysis of 8th-grade exam results for primary schools in the Mazowieckie voivodeship."
requires-python = ">=3.11"
dependencies = [
    "jupyterlab",
    "matplotlib",
    "notebook>=7.5.6",
    "numpy",
    "openpyxl",
    "pandas",
    "scipy>=1.17.1",
    "seaborn",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
# src/ is on the path rather than installed: no build backend needed, and the
# notebook reaches the same modules by adding ../src to sys.path.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 99

[tool.ruff.format]
quote-style = "single"
