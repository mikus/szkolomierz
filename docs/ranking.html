<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranking szkół podstawowych</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-ranking">
  <header class="topnav">
    <h1 data-i18n="rankingTitle">Ranking szkół podstawowych</h1>
    <nav>
      <a href="index.html" data-i18n="navMap">Mapa</a>
      <a href="ranking.html" class="active" data-i18n="navRanking">Ranking</a>
      <a href="help.html" data-i18n="navHelp">Pomoc</a>
      <div id="lang-toggle" class="lang-toggle" role="group" aria-label="Język / Language"></div>
    </nav>
  </header>

  <main>
    <div class="ranking-controls">
      <div class="field field--level">
        <span>
          <label for="level-select" data-i18n="labelRankLevel">Poziom rankingu</label><span
            class="help-icon" tabindex="0" role="button" aria-label="?"
            data-i18n-attr="data-help|helpRankLevel">i</span>
        </span>
        <select id="level-select"></select>
      </div>

      <!-- Only meaningful at school level, so it is disabled (not hidden) at the
           three region levels, with #level-note saying why — the same pattern as
           the map's baseline-select / #baseline-note. That note lives in
           .ranking-meta rather than here: this is a flex row of short fields, and
           a sentence inside one of them stretches it across half the row. -->
      <div class="field field--region">
        <label for="region-select" data-i18n="labelRegion">Wybrany powiat</label>
        <!-- One static option so the disabled control at a region level reads as an
             empty picker rather than an empty box. fillRegionSelect() replaces it
             with an identical one when the 380 powiats land. -->
        <select id="region-select">
          <option value="" data-i18n="regionPlaceholder">— wybierz powiat —</option>
        </select>
      </div>

      <div class="field field--metric">
        <span>
          <label for="metric-select" data-i18n="labelMetric">Metryka</label><a
            class="help-icon" href="help.html#metrics" aria-label="?"
            data-i18n-attr="data-help|helpMetric">i</a>
        </span>
        <select id="metric-select"></select>
      </div>

      <label class="field field--subject">
        <span data-i18n="labelSubject">Przedmiot</span>
        <select id="subject-select"></select>
      </label>

      <label class="field field--view">
        <span data-i18n="rankingView">Widok danych</span>
        <select id="view-select">
          <option value="base" data-i18n="rankingViewBase">wszystkie lata (base)</option>
          <option value="last_k" data-i18n="rankingViewLastK">ostatnie k lat (last_k)</option>
          <option value="single_year" data-i18n="rankingViewSingleYear">jeden rok (single_year)</option>
          <option value="loo" data-i18n="rankingViewLOO">bez jednego roku (LOO)</option>
        </select>
      </label>

      <label class="field" id="view-param-field" style="display:none;">
        <span data-i18n="rankingViewParam">Parametr widoku</span>
        <select id="view-param-select"></select>
      </label>

      <fieldset class="field radio-group">
        <legend data-i18n="labelPublic">Typ szkoły</legend>
        <label><input type="radio" name="public" value="all" checked> <span data-i18n="publicAll">Wszystkie</span></label>
        <label><input type="radio" name="public" value="tak"> <span data-i18n="publicYes">Publiczne</span></label>
        <label><input type="radio" name="public" value="nie"> <span data-i18n="publicNo">Niepubliczne</span></label>
      </fieldset>

      <label class="field field--search">
        <span data-i18n="rankingNameSearch">Szukaj po nazwie</span>
        <input type="text" id="name-search" placeholder="np. STO, Vizja, Słupica" data-i18n-attr="placeholder|rankingSearchPlaceholder">
      </label>
    </div>

    <div class="ranking-meta">
      <p class="data-years" id="data-years"></p>
      <p id="ranking-info"></p>
      <!-- Why the region / view / public controls are greyed out at a region
           level. Empty (and collapsed by .field-note:empty) at school level. -->
      <p id="level-note" class="field-note"></p>
      <!-- Stands in for the table when there is nothing honest to rank yet:
           school level with no county picked, a population still loading, or a
           failed fetch. Hidden by JS when the table has rows. -->
      <p id="ranking-prompt"></p>
      <p class="small click-hint" data-i18n="clickHint">Kliknij wiersz, aby rozwinąć szczegóły szkoły.</p>
      <p class="muted small meta-links"><a href="help.html#stability" data-i18n="helpLink">Jak liczone są wyniki? → Pomoc</a></p>

      <details class="settings-block">
        <summary data-i18n="sectionSettings">Ustawienia</summary>
        <label class="checkbox-field">
          <input type="checkbox" id="advanced-metrics-toggle">
          <span data-i18n="advancedMetrics">Metryki zaawansowane</span>
        </label>
        <p class="muted small" data-i18n="advancedMetricsHelp"></p>
      </details>
    </div>

    <div class="ranking-table-wrap">
      <table class="ranking-table" id="ranking-table"></table>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="ranking.js"></script>
</body>
</html>
